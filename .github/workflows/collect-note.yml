name: Collect note articles

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum articles to collect; 0 means all discovered articles
        required: true
        default: "0"
      max_pages:
        description: Safety limit for note creator API pagination
        required: true
        default: "100"
      overwrite:
        description: Replace existing unreviewed snapshots and cards
        required: true
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/collect-note.yml"
      - "scripts/collect_note.py"
      - "scripts/collect_note_api.py"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: collect-note
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect articles
        env:
          LIMIT: ${{ inputs.limit || '0' }}
          MAX_PAGES: ${{ inputs.max_pages || '100' }}
          OVERWRITE: ${{ inputs.overwrite || 'false' }}
        run: |
          args=(--profile "https://note.com/shirokuma1970" --limit "$LIMIT" --max-pages "$MAX_PAGES")
          if [[ "$OVERWRITE" == "true" ]]; then
            args+=(--overwrite)
          fi
          python scripts/collect_note_api.py "${args[@]}"

      - name: Commit collected files
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/INDEX.md articles/cards sources/note
          git commit -m "Collect note articles"
          git push
