name: Temporary finalize nb77b6d5f092f

on:
  push:
    paths:
      - ".github/workflows/collect-note.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Finalize analysis state
        run: python3 scripts/temp_finalize_nb77.py
      - name: Restore workflow and remove temporary script
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/collect-note.yml
          git rm -f scripts/temp_finalize_nb77.py
      - name: Commit finalized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add START_HERE.md analysis/COVERAGE.json analysis/COVERAGE.md analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md analysis/KEY_ARTICLE_SELECTION.md analysis/STABILIZATION_AUDIT_REGISTER.md analysis/stabilization_audit/OPERATIONS.md articles/CARD_INDEX.md articles/INDEX.md context/CURRENT.md context/NEXT.md review/INBOX.md .github/workflows/collect-note.yml
          git commit -m "Finalize original-first analysis for nb77b6d5f092f"
          git push
