name: Finalize n4940d2f00d0a coverage

on:
  push:
    paths:
      - ".github/workflows/collect-note.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Accept original-first analysis
        run: |
          python scripts/update_analysis_coverage.py \
            --accept n4940d2f00d0a \
            --coverage-type individual_card \
            --analysis-ref articles/cards/2026-07-06-n4940d2f00d0a.md \
            --role "皇統の判定原理・民意の前提・旧宮家案"
          python scripts/update_analysis_coverage.py
          python scripts/note_index.py
          python scripts/temp_finalize_n494.py

      - name: Restore temporary files and commit results
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/collect-note.yml
          rm scripts/temp_finalize_n494.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            START_HERE.md \
            analysis/COVERAGE.json \
            analysis/COVERAGE.md \
            analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md \
            analysis/KEY_ARTICLE_SELECTION.md \
            analysis/STABILIZATION_AUDIT_REGISTER.md \
            analysis/stabilization_audit/OPERATIONS.md \
            articles/CARD_INDEX.md \
            articles/INDEX.md \
            context/CURRENT.md \
            context/NEXT.md \
            review/INBOX.md \
            .github/workflows/collect-note.yml \
            scripts/temp_finalize_n494.py
          git commit -m "Finalize coverage state for n4940d2f00d0a [skip ci]"
          git push
