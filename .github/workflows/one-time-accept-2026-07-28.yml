name: One-time accept 2026-07-28 article reviews

on:
  push:
    paths:
      - ".github/workflows/one-time-accept-2026-07-28.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: note-review-decision
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate review scripts
        run: |
          python -m py_compile \
            scripts/note_index.py \
            scripts/build_compact_article_map.py \
            scripts/update_analysis_coverage.py \
            scripts/sync_review_issue.py

      - name: Accept reviewed article states
        run: |
          python scripts/update_analysis_coverage.py \
            --accept n6b7e22574d71 \
            --analysis-ref articles/cards/2026-07-28-n6b7e22574d71.md \
            --coverage-type individual_card \
            --role "統合稿・適用稿"

          python scripts/update_analysis_coverage.py \
            --accept nc4bdd50cbcfa \
            --analysis-ref articles/cards/2026-07-28-nc4bdd50cbcfa.md \
            --coverage-type individual_card \
            --role "衝突記録・方法論化・運用設計"

          python scripts/update_analysis_coverage.py
          python scripts/build_compact_article_map.py
          python scripts/note_index.py

      - name: Remove one-time workflow and commit results
        run: |
          rm .github/workflows/one-time-accept-2026-07-28.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/one-time-accept-2026-07-28.yml \
            analysis/COVERAGE.json \
            analysis/COVERAGE.md \
            review/INBOX.md \
            articles/CARD_INDEX.md \
            articles/COMPACT_MAP.md \
            articles/maps
          git commit -m "Accept 2026-07-28 article reviews"
          git pull --rebase
          git push

      - name: Synchronize review issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_review_issue.py
