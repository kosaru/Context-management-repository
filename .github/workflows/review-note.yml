name: Apply note review decision

on:
  workflow_dispatch:
    inputs:
      action:
        description: Review decision to apply
        required: true
        type: choice
        options:
          - accept
          - defer
          - reopen
      note_id:
        description: note article ID
        required: true
      analysis_ref:
        description: Repository-relative analysis reference; optional for accept when a card exists
        required: false
        default: ""
      coverage_type:
        description: Coverage type used when accepting
        required: true
        type: choice
        options:
          - individual_card
          - cross_index
          - phase_bundle
          - other
        default: individual_card
      role:
        description: Article role, such as 修正, 反例, 統合稿
        required: false
        default: ""
      defer_reason:
        description: Required when action is defer
        required: false
        default: ""
      recheck_after:
        description: Recheck date or timing
        required: false
        default: ""
      recheck_condition:
        description: Condition that should reopen the review
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: review-note-${{ inputs.note_id }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate review scripts
        run: |
          python -m py_compile \
            scripts/collect_note.py \
            scripts/note_index.py \
            scripts/update_analysis_coverage.py

      - name: Apply review decision
        env:
          REVIEW_ACTION: ${{ inputs.action }}
          NOTE_ID: ${{ inputs.note_id }}
          ANALYSIS_REF: ${{ inputs.analysis_ref }}
          COVERAGE_TYPE: ${{ inputs.coverage_type }}
          ROLE: ${{ inputs.role }}
          DEFER_REASON: ${{ inputs.defer_reason }}
          RECHECK_AFTER: ${{ inputs.recheck_after }}
          RECHECK_CONDITION: ${{ inputs.recheck_condition }}
        run: |
          case "$REVIEW_ACTION" in
            accept)
              args=(--accept "$NOTE_ID" --coverage-type "$COVERAGE_TYPE")
              if [[ -n "$ANALYSIS_REF" ]]; then
                args+=(--analysis-ref "$ANALYSIS_REF")
              fi
              if [[ -n "$ROLE" ]]; then
                args+=(--role "$ROLE")
              fi
              ;;
            defer)
              if [[ -z "$DEFER_REASON" ]]; then
                echo "defer_reason is required when action=defer" >&2
                exit 2
              fi
              args=(--defer "$NOTE_ID" --defer-reason "$DEFER_REASON")
              if [[ -n "$RECHECK_AFTER" ]]; then
                args+=(--recheck-after "$RECHECK_AFTER")
              fi
              if [[ -n "$RECHECK_CONDITION" ]]; then
                args+=(--recheck-condition "$RECHECK_CONDITION")
              fi
              ;;
            reopen)
              args=(--reopen "$NOTE_ID")
              ;;
            *)
              echo "Unknown review action: $REVIEW_ACTION" >&2
              exit 2
              ;;
          esac
          python scripts/update_analysis_coverage.py "${args[@]}"

      - name: Commit review decision
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            analysis/COVERAGE.json \
            analysis/COVERAGE.md \
            review/INBOX.md
          git commit -m "Apply note review decision for ${{ inputs.note_id }}"
          git pull --rebase
          git push
