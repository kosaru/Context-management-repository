name: Temporary accept na93e6bf0376c

on:
  push:
    branches:
      - agent/analyze-na93e6bf0376c
    paths:
      - .github/workflows/temp-accept-na93e6bf0376c.yml

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analyze-na93e6bf0376c
      - name: Accept article coverage
        run: |
          python scripts/update_analysis_coverage.py \
            --accept na93e6bf0376c \
            --analysis-ref articles/cards/2026-07-01-na93e6bf0376c.md \
            --coverage-type individual_card \
            --role '自称リベラルへの直接要求・設計責任'
          python scripts/note_index.py
      - name: Update audit registers and entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing marker in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_after(path: str, marker: str, addition: str) -> None:
              replace_once(path, marker, marker + addition)

          # Global audit register: keep legacy rewrites separate from new original-first analysis.
          replace_once(
              'analysis/STABILIZATION_AUDIT_REGISTER.md',
              '既存の詳細カード75件、時期別解析、横断分析、派生モデルは、元文章の強度保持を確認していない。',
              '既存監査由来の詳細カード75件と、新規・原文先行カード1件を管理する。時期別解析、横断分析、派生モデルは、原文より上位の正本として扱わない。'
          )
          insert_after(
              'analysis/STABILIZATION_AUDIT_REGISTER.md',
              '- 改稿候補・ユーザー確認待ち：74件\n',
              '- 新規・原文先行分析・ユーザー確認待ち：1件\n'
          )
          replace_once('analysis/STABILIZATION_AUDIT_REGISTER.md', '- 未処理：0件', '- 旧監査対象の未処理：0件')
          replace_once('analysis/STABILIZATION_AUDIT_REGISTER.md', '## 個別カード75件の現在地', '## 個別カード76件の現在地')
          replace_once('analysis/STABILIZATION_AUDIT_REGISTER.md', '- `PENDING`：0件', '- `PENDING`：1件')
          replace_once(
              'analysis/STABILIZATION_AUDIT_REGISTER.md',
              'HIGH-RISKは0件になったが、これは強度監査通過を意味しない。すべてユーザー確認前の改稿候補であり、PASSEDは0件である。',
              'HIGH-RISKは0件だが、これは強度監査通過を意味しない。74件は改稿候補、1件は使用停止、1件は新規・原文先行分析のユーザー確認待ちであり、PASSEDは0件である。'
          )
          replace_once(
              'analysis/STABILIZATION_AUDIT_REGISTER.md',
              '## 改稿候補74件\n',
              '## 新規・原文先行分析1件\n\n- `na93e6bf0376c`　リベラルは、批判のあとに何を設計するのか（`PENDING`）\n\n## 改稿候補74件\n'
          )
          insert_after(
              'analysis/STABILIZATION_AUDIT_REGISTER.md',
              '- `analysis/stabilization_audit/CARDS_05_2026-07-28.md`：2件（全件改稿候補作成済み）\n',
              '- `analysis/stabilization_audit/CARDS_06_NEW_ANALYSIS_2026-07-01.md`：1件（新規・原文先行、PENDING）\n'
          )

          # START_HERE
          replace_once(
              'START_HERE.md',
              '既存の詳細カード75件は原文比較まで行い、74件を改稿候補、1件を使用停止とした。ただし、**ユーザー確認前であり、PASSEDは0件**です。',
              '既存監査由来の詳細カード75件は、74件を改稿候補、1件を使用停止とした。さらに新規・原文先行カード1件を作成した。**すべてユーザー確認前であり、PASSEDは0件**です。'
          )
          replace_once('START_HERE.md', '- 文脈解析あり：353件', '- 文脈解析あり：354件')
          replace_once('START_HERE.md', '- 個別カードあり：104件（詳細カード75件＋未解析カード29件）', '- 個別カードあり：104件（詳細カード76件＋未解析カード28件）')
          insert_after('START_HERE.md', '- 詳細カードの改稿候補：74件\n', '- 新規・原文先行分析：1件（PENDING）\n')
          insert_after('START_HERE.md', '9. `analysis/stabilization_audit/CARDS_05_2026-07-28.md`\n', '10. `analysis/stabilization_audit/CARDS_06_NEW_ANALYSIS_2026-07-01.md`\n')
          replace_once('START_HERE.md', '10. `analysis/stabilization_audit/MODELS_AND_INDEXES.md`', '11. `analysis/stabilization_audit/MODELS_AND_INDEXES.md`')
          replace_once('START_HERE.md', '11. `analysis/stabilization_audit/BATCHES_AND_CROSS.md`', '12. `analysis/stabilization_audit/BATCHES_AND_CROSS.md`')
          replace_once('START_HERE.md', '12. `analysis/stabilization_audit/OPERATIONS.md`', '13. `analysis/stabilization_audit/OPERATIONS.md`')

          # CURRENT
          replace_once(
              'context/CURRENT.md',
              '現在は、74件を一括承認せず、実際に参照する記事から個別にユーザー判断へ回す運用段階にある。',
              '現在は、未割り当て・新着をレビュー待ち順に原文から個別解析し、既存74件と同様に一括承認せず、ユーザー判断へ回す運用段階にある。'
          )
          replace_once('context/CURRENT.md', '- 文脈解析あり：353件', '- 文脈解析あり：354件')
          replace_once('context/CURRENT.md', '- 未割り当て・新着：29件', '- 未割り当て・新着：28件')
          replace_once('context/CURRENT.md', '- 詳細カード：75件', '- 詳細カード：76件')
          insert_after('context/CURRENT.md', '- 詳細カードの改稿候補：74件\n', '- 新規・原文先行分析：1件（PENDING）\n')
          replace_once('context/CURRENT.md', '## 詳細カード75件の割当て', '## 詳細カード76件の割当て')
          insert_after('context/CURRENT.md', '- 2026-07-28追加監査：2件\n', '- 2026-07-01新規・原文先行：1件\n')
          replace_once('context/CURRENT.md', '- 合計：75件', '- 合計：76件')

          # NEXT: replace the stale opening block, then register the new bundle.
          p = Path('context/NEXT.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 完了した監査束\n'
          if marker not in text:
              raise SystemExit('missing NEXT completed marker')
          rest = text.split(marker, 1)[1]
          prefix = '''# 次の文脈

更新日：2026-07-28

## 現在の作業

未割り当て・新着を、`review/INBOX.md` の順に原文から個別解析する。

新規カードは、旧テンプレートや既存横断モデルから作らない。

```text
取得時スナップショットを読む
→ 原文の最強命題、拒否、選択、緊張、非対称性を残す
→ 原文で実際に退けた読みだけを書く
→ 後続記事との直接継承と構造接続を分ける
→ ユーザー確認前はPENDING
→ 横断索引へ自動回収しない
```

停止中：

- B-03以降の再判定
- 重要記事の自動選定
- 新しい横断モデルの作成
- AIによる一括PASSED

現在地：

- 公開記事台帳：382件
- 文脈解析あり：354件
- 未割り当て・新着：28件
- 個別カードあり：104件
- 詳細カード：76件
- 改稿候補：74件
- 使用停止：1件
- 新規・原文先行分析：1件（PENDING）
- PASSED：0件

'''
          text = prefix + marker + rest
          text = text.replace(
              '- `CARDS_05_2026-07-28.md`：2件すべて改稿候補作成済み\n',
              '- `CARDS_05_2026-07-28.md`：2件すべて改稿候補作成済み\n- `CARDS_06_NEW_ANALYSIS_2026-07-01.md`：1件を新規・原文先行で作成、PENDING\n',
              1
          )
          text = text.replace(
              '## 直近に追加した個別カード監査\n',
              '## 直近の新規・原文先行カード\n\n- `na93e6bf0376c`：自称リベラルへの直接要求を弱めず、批判者の安全圏から設計責任へ移る命令として記録\n- 監査記録：`analysis/stabilization_audit/CARDS_06_NEW_ANALYSIS_2026-07-01.md`\n- 状態：`PENDING`、`PASSED`ではない\n\n## 直近に追加した既存カード監査\n',
              1
          )
          text = text.replace(
              '- `analysis/stabilization_audit/CARDS_05_2026-07-28.md`\n',
              '- `analysis/stabilization_audit/CARDS_05_2026-07-28.md`\n- `analysis/stabilization_audit/CARDS_06_NEW_ANALYSIS_2026-07-01.md`\n',
              1
          )
          p.write_text(text, encoding='utf-8')

          # Human article index.
          replace_once('articles/INDEX.md', '- 文脈解析あり：353件', '- 文脈解析あり：354件')
          replace_once('articles/INDEX.md', '- 文脈未解析・新着：29件', '- 文脈未解析・新着：28件')
          replace_once('articles/INDEX.md', '- 詳細カード：75件（改稿候補74件＋使用停止1件）', '- 詳細カード：76件（改稿候補74件＋使用停止1件＋新規・原文先行PENDING 1件）')
          replace_once('articles/INDEX.md', '- 未解析カード：29件', '- 未解析カード：28件')
          replace_once(
              'articles/INDEX.md',
              '詳細カード75件は原文比較まで行いましたが、74件は改稿候補・ユーザー確認待ち、1件は使用停止です。PASSEDは0件です。',
              '詳細カード76件のうち、74件は改稿候補・ユーザー確認待ち、1件は使用停止、1件は新規・原文先行分析のPENDINGです。PASSEDは0件です。'
          )
          insert_after('articles/INDEX.md', '9. [2026-07-28追加カード2件](../analysis/stabilization_audit/CARDS_05_2026-07-28.md)\n', '10. [新規・原文先行カード1件](../analysis/stabilization_audit/CARDS_06_NEW_ANALYSIS_2026-07-01.md)\n')
          replace_once('articles/INDEX.md', '10. [モデル監査]', '11. [モデル監査]')
          replace_once('articles/INDEX.md', '11. [バッチ・横断分析監査]', '12. [バッチ・横断分析監査]')
          replace_once('articles/INDEX.md', '12. [運用監査]', '13. [運用監査]')
          insert_after('articles/INDEX.md', '- 詳細カード74件の改稿候補\n', '- 新規・原文先行カード1件（PENDING）\n')

          # Progress and selection ledgers.
          replace_once('analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md', '- 詳細カード：75件', '- 詳細カード：76件')
          insert_after('analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md', '- `CONFIRMED-WITHDRAWN`：1件\n', '- `PENDING`：1件（新規・原文先行）\n')
          replace_once('analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md', '- 未解析カード：29件', '- 未解析カード：28件')
          replace_once('analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md', '## 詳細カード75件の割当て', '## 詳細カード76件の割当て')
          insert_after('analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md', '| 2026-07-28追加監査 | 2 | `analysis/stabilization_audit/CARDS_05_2026-07-28.md` |\n', '| 新規・原文先行 | 1 | `analysis/stabilization_audit/CARDS_06_NEW_ANALYSIS_2026-07-01.md` |\n')
          replace_once('analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md', '| 合計 | 75 |', '| 合計 | 76 |')
          replace_once(
              'analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md',
              '実際に記事を参照する場面で、原文、監査記録、改稿候補を照合し、ユーザー判断へ個別に回す。',
              '未割り当て・新着は原文先行で個別解析し、既存改稿候補と混ぜず、ユーザー判断へ個別に回す。'
          )

          replace_once('analysis/KEY_ARTICLE_SELECTION.md', '- 詳細カード：75件', '- 詳細カード：76件')
          insert_after('analysis/KEY_ARTICLE_SELECTION.md', '- 使用停止：1件\n', '- 新規・原文先行分析：1件（PENDING）\n')
          replace_once('analysis/KEY_ARTICLE_SELECTION.md', '詳細カード75件は、次の監査台帳へ移した。', '詳細カード76件は、次の監査台帳へ記録した。')
          insert_after('analysis/KEY_ARTICLE_SELECTION.md', '- `analysis/stabilization_audit/CARDS_05_2026-07-28.md`\n', '- `analysis/stabilization_audit/CARDS_06_NEW_ANALYSIS_2026-07-01.md`\n')

          # Operations audit display.
          replace_once('analysis/stabilization_audit/OPERATIONS.md', '監査対象の詳細カード：75件\n新着・未割り当て等の未解析カード：29件', '監査対象の詳細カード：76件\n新着・未割り当て等の未解析カード：28件')
          replace_once('analysis/stabilization_audit/OPERATIONS.md', '- 詳細カード75件', '- 詳細カード76件')
          insert_after('analysis/stabilization_audit/OPERATIONS.md', '- 使用停止1件\n', '- 新規・原文先行分析1件（PENDING）\n')
          replace_once('analysis/stabilization_audit/OPERATIONS.md', '- 未解析カード29件', '- 未解析カード28件')
          PY
      - name: Validate state
        run: |
          grep -F '文脈解析済み：354件' analysis/COVERAGE.md
          grep -F '未割り当て・新着：28件' analysis/COVERAGE.md
          grep -F '| 個別記事カード | 76 |' analysis/COVERAGE.md
          grep -F '確認待ち：29件' review/INBOX.md
          grep -F '## 個別カード76件の現在地' analysis/STABILIZATION_AUDIT_REGISTER.md
          grep -F '`PENDING`：1件' analysis/STABILIZATION_AUDIT_REGISTER.md
          grep -F 'CARDS_06_NEW_ANALYSIS_2026-07-01.md' context/NEXT.md
          grep -F '新規・原文先行分析：1件' START_HERE.md
      - name: Commit generated and ledger updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/COVERAGE.json analysis/COVERAGE.md review/INBOX.md articles/CARD_INDEX.md \
            analysis/STABILIZATION_AUDIT_REGISTER.md START_HERE.md context/CURRENT.md context/NEXT.md \
            articles/INDEX.md analysis/INDIVIDUAL_ARTICLE_REVIEW_PROGRESS.md \
            analysis/KEY_ARTICLE_SELECTION.md analysis/stabilization_audit/OPERATIONS.md
          git commit -m 'Accept original-first liberal redesign analysis'
          git push origin HEAD:agent/analyze-na93e6bf0376c
