name: Temporary accept na93e6bf0376c

on:
  push:
    branches:
      - agent/analyze-na93e6bf0376c
    paths:
      - .github/workflows/temp-accept-na93e6bf0376c.yml

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analyze-na93e6bf0376c
      - name: Accept article coverage and rebuild indexes
        run: |
          python scripts/update_analysis_coverage.py \
            --accept na93e6bf0376c \
            --analysis-ref articles/cards/2026-07-01-na93e6bf0376c.md \
            --coverage-type individual_card \
            --role '自称リベラルへの直接要求・設計責任'
          python scripts/note_index.py
      - name: Validate generated state
        run: |
          grep -F '文脈解析済み：354件' analysis/COVERAGE.md
          grep -F '未割り当て・新着：28件' analysis/COVERAGE.md
          grep -F '| 個別記事カード | 76 |' analysis/COVERAGE.md
          grep -F '確認待ち：29件' review/INBOX.md
      - name: Commit generated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/COVERAGE.json analysis/COVERAGE.md review/INBOX.md articles/CARD_INDEX.md
          git commit -m '[skip ci] Accept na93e6bf0376c coverage'
          git push origin HEAD:agent/analyze-na93e6bf0376c
