name: Temporary refresh audit register

on:
  push:
    branches:
      - agent/refresh-audit-register-2026-07-28
    paths:
      - .github/workflows/temp-refresh-audit-register.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refresh-audit-register-2026-07-28
      - name: Patch audit register and next context
        run: |
          python - <<'PY'
          from pathlib import Path

          register = Path('analysis/STABILIZATION_AUDIT_REGISTER.md')
          text = register.read_text(encoding='utf-8')
          replacements = {
              '更新日：2026-06-26': '更新日：2026-07-28',
              '既存の詳細カード73件': '既存の詳細カード75件',
              '- 改稿候補・ユーザー確認待ち：72件': '- 改稿候補・ユーザー確認待ち：74件',
              '## 個別カード73件の現在地': '## 個別カード75件の現在地',
              '- `REWRITTEN-PENDING-USER`：72件': '- `REWRITTEN-PENDING-USER`：74件',
              '## 改稿候補72件': '## 改稿候補74件',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing register marker: {old}')
              text = text.replace(old, new, 1)

          article_marker = '- `ne689a6405eba`　AIとの対話には、プロンプトの技より先に「稽古」がいる\n'
          article_insert = (
              article_marker
              + '- `n6b7e22574d71`　洪水は気候変動、陥没は行政の遅れ――集中管理型インフラが「原因」から消える報道\n'
              + '- `nc4bdd50cbcfa`　AIはなぜ「別の原因も調べろ」を陰謀論に変えたのか――何度問いを戻しても戻らない対話と、高性能化が奪う「問いの主権」\n'
          )
          if article_marker not in text or '`n6b7e22574d71`' in text:
              raise SystemExit('article insertion precondition failed')
          text = text.replace(article_marker, article_insert, 1)

          bundle_marker = '- `analysis/stabilization_audit/CARDS_04_POLITICS_AND_B_GROUP.md`：13件（全件改稿候補作成済み）\n'
          bundle_insert = bundle_marker + '- `analysis/stabilization_audit/CARDS_05_2026-07-28.md`：2件（全件改稿候補作成済み）\n'
          if bundle_marker not in text or 'CARDS_05_2026-07-28.md`：2件' in text:
              raise SystemExit('register bundle insertion precondition failed')
          text = text.replace(bundle_marker, bundle_insert, 1)
          register.write_text(text, encoding='utf-8')

          nxt = Path('context/NEXT.md')
          text = nxt.read_text(encoding='utf-8')
          replacements = {
              '更新日：2026-06-30': '更新日：2026-07-28',
              '- 個別カード73件': '- 個別カード75件',
              '- 個別カード：72件が改稿候補、1件が使用停止、PASSED 0件': '- 個別カード：74件が改稿候補、1件が使用停止、PASSED 0件',
              '## 今回作成した改稿候補': '## 直前の横断監査で作成した改稿候補',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing NEXT marker: {old}')
              text = text.replace(old, new, 1)

          completed_marker = '- `CARDS_04_POLITICS_AND_B_GROUP.md`：13件すべて改稿候補作成済み\n'
          completed_insert = completed_marker + '- `CARDS_05_2026-07-28.md`：2件すべて改稿候補作成済み\n'
          if completed_marker not in text or 'CARDS_05_2026-07-28.md`：2件すべて' in text:
              raise SystemExit('NEXT completed insertion precondition failed')
          text = text.replace(completed_marker, completed_insert, 1)

          latest_marker = '全件ユーザー確認待ちであり、PASSEDではない。\n\n'
          latest_section = (
              latest_marker
              + '## 直近に追加した個別カード監査\n\n'
              + '- `n6b7e22574d71`：メディアへの直接要求と責任主体を復元し、`REWRITTEN-PENDING-USER`\n'
              + '- `nc4bdd50cbcfa`：ChatGPT／OpenAIの名指しと利用者へ集中した修復負荷を復元し、`REWRITTEN-PENDING-USER`\n'
              + '- 監査記録：`analysis/stabilization_audit/CARDS_05_2026-07-28.md`\n'
              + '- `PASSED`：0件のまま\n\n'
          )
          if latest_marker not in text or '## 直近に追加した個別カード監査' in text:
              raise SystemExit('NEXT latest section precondition failed')
          text = text.replace(latest_marker, latest_section, 1)

          index_marker = '- `analysis/stabilization_audit/CARDS_04_POLITICS_AND_B_GROUP.md`\n'
          index_insert = index_marker + '- `analysis/stabilization_audit/CARDS_05_2026-07-28.md`\n'
          if index_marker not in text:
              raise SystemExit('NEXT index insertion precondition failed')
          text = text.replace(index_marker, index_insert, 1)
          nxt.write_text(text, encoding='utf-8')
          PY
      - name: Validate patched values
        run: |
          grep -F '既存の詳細カード75件' analysis/STABILIZATION_AUDIT_REGISTER.md
          grep -F '## 改稿候補74件' analysis/STABILIZATION_AUDIT_REGISTER.md
          grep -F 'CARDS_05_2026-07-28.md' analysis/STABILIZATION_AUDIT_REGISTER.md
          grep -F -- '- 個別カード75件' context/NEXT.md
          grep -F '74件が改稿候補' context/NEXT.md
          grep -F 'CARDS_05_2026-07-28.md' context/NEXT.md
      - name: Commit refreshed registers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/STABILIZATION_AUDIT_REGISTER.md context/NEXT.md
          git commit -m 'Refresh stabilization audit totals'
          git push origin HEAD:agent/refresh-audit-register-2026-07-28
